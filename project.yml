name: FamilyTap
options:
  bundleIdPrefix: com.yumita
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: 2.0.0

targets:
  FamilyTap:
    type: application
    platform: iOS
    sources:
      - path: FamilyTap
    dependencies:
      - package: Supabase
        product: Supabase
    info:
      path: Generated/Info.plist
      properties:
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yumita.familytap
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: FamilyTap/FamilyTap.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        DEVELOPMENT_ASSET_PATHS: "\"FamilyTap/Resources/Preview Content\""
        ENABLE_PREVIEWS: true
    scheme:
      testTargets: []
      gatherCoverageData: false
